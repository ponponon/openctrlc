name: openctrlc-remote-p2p

services:
  relay:
    build:
      context: packages/remote-relay
      dockerfile: Dockerfile
    image: openctrlc/remote-relay:p2p
    container_name: openctrlc-remote-p2p-relay
    restart: unless-stopped
    init: true
    user: "${OPENCTRLC_RELAY_UID:-65532}:${OPENCTRLC_RELAY_GID:-65532}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      HOST: 0.0.0.0
      PORT: 4097
      OPENCTRLC_REMOTE_PUBLIC_URL: https://openctrlc-p2p.quniv.cn
      OPENCTRLC_REMOTE_DATA_DIR: /data
      OPENCTRLC_STUN_URLS: stun:openctrlc-p2p.quniv.cn:3478
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:4098:4097"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4097/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  stun:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    init: true
    network_mode: host
    read_only: true
    tmpfs:
      - /var/tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    command:
      - -n
      - --log-file=stdout
      - --stun-only
      - --no-tcp
      - --no-tls
      - --listening-port=3478
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
