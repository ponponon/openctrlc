    # Managed by OpenCtrlC Remote Relay deployment.
server {
    listen 80;
    server_name openctrlc-remote.quniv.cn;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name openctrlc-remote.quniv.cn;

    ssl_certificate /www/sites/quniv.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/quniv.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OPENCTRLC_REMOTE:10m;
    ssl_session_timeout 10m;

    access_log off;
    error_log /dev/null emerg;

    client_max_body_size 17m;
    proxy_read_timeout 8h;
    proxy_send_timeout 8h;
    proxy_buffering off;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        return 404;
    }

    location = /_remote/refresh-workspace {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "__Host-oc_remote_boot=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict" always;
        return 302 /;
    }

    location / {
        proxy_pass http://127.0.0.1:4097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
