    # Managed by OpenCtrlC Remote Relay deployment.
server {
    listen 80;
    server_name openctrlc-remote.quniv.cn;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name openctrlc-remote.quniv.cn;

    ssl_certificate /www/sites/quniv.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/quniv.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OPENCTRLC_REMOTE:10m;
    ssl_session_timeout 10m;

    access_log off;
    error_log /dev/null emerg;

    client_max_body_size 17m;
    proxy_read_timeout 8h;
    proxy_send_timeout 8h;
    proxy_buffering off;
    proxy_request_buffering off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        return 404;
    }

    location = /_remote/refresh-workspace {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        add_header Set-Cookie "__Host-oc_remote_boot=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict" always;
        return 302 /;
    }

    location ^~ /join/ {
        proxy_pass http://127.0.0.1:4097;
        proxy_http_version 1.1;
        # Update pairing guidance without restarting a Relay that still holds live grants in memory.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter "The request is on your desktop. Waiting for your approval…" "On your desktop, open OpenCtrlC → Mobile access and click Allow beside this device request. Keep this page open.";
        sub_filter "The desktop has not confirmed the request yet. If it is visible there, wait for approval; otherwise check OpenCtrlC and keep this page open." "The desktop has not confirmed receipt yet. Check that OpenCtrlC is running. When this request appears under Mobile access, click Allow. Keep this page open.";
        sub_filter "桌面端已收到请求，等待你批准…" "请回到 OpenCtrlC 桌面版，打开「手机访问」，在这台设备的连接请求旁点击「允许」。请保持此页面打开。";
        sub_filter "桌面端尚未确认收到请求。如果电脑上已显示请求，请等待批准；否则检查 OpenCtrlC 是否在线，并保持此页面打开。" "桌面端尚未确认收到请求。请确认电脑上的 OpenCtrlC 正在运行；请求显示在「手机访问」窗口后，点击这台设备旁的「允许」。请保持此页面打开。";
        sub_filter "リクエストがデスクトップに届きました。承認を待っています…" "OpenCtrlC デスクトップアプリに戻り、「スマートフォンからアクセス」を開いて、この端末のリクエストの横にある「許可」をクリックしてください。このページは開いたままにしてください。";
        sub_filter "デスクトップからの確認がありません。画面にリクエストが表示されていれば承認を待ち、表示されていなければ OpenCtrlC の接続を確認してください。" "デスクトップからまだ受信確認がありません。OpenCtrlC が起動していることを確認してください。リクエストが「スマートフォンからアクセス」に表示されたら、「許可」をクリックしてください。このページは開いたままにしてください。";
        sub_filter "요청이 데스크톱에 도착했습니다. 승인을 기다리는 중…" "OpenCtrlC 데스크톱 앱으로 돌아가 ‘휴대폰 원격 액세스’를 열고, 이 기기 요청 옆의 ‘허용’을 누르세요. 이 페이지는 열어 두세요.";
        sub_filter "데스크톱에서 아직 요청을 확인하지 않았습니다. 화면에 요청이 보이면 승인을 기다리고, 보이지 않으면 OpenCtrlC 연결을 확인하세요." "데스크톱에서 아직 요청 수신을 확인하지 않았습니다. OpenCtrlC가 실행 중인지 확인하세요. 요청이 ‘휴대폰 원격 액세스’에 표시되면 ‘허용’을 누르세요. 이 페이지를 열어 두세요.";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location / {
        proxy_pass http://127.0.0.1:4097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
