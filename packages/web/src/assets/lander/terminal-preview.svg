<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenCtrlC terminal preview</title>
  <desc id="desc">A branded OpenCtrlC terminal session inspecting a project and preparing a safe change.</desc>
  <defs>
    <linearGradient id="surface" x1="122" y1="86" x2="1490" y2="906" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27312C"/>
      <stop offset="1" stop-color="#151A17"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="120" x2="1350" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F58A62" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F58A62" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="70" y="60" width="1460" height="880" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#1F2521" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="100" y="86" width="1400" height="800" rx="28" fill="url(#surface)" stroke="#4A5750" stroke-width="2" filter="url(#shadow)"/>
  <rect x="101" y="87" width="1398" height="798" rx="27" fill="url(#glow)"/>
  <path d="M101 162H1499" stroke="#4A5750" stroke-width="2"/>

  <circle cx="140" cy="124" r="10" fill="#ED7550"/>
  <circle cx="174" cy="124" r="10" fill="#D5A34A"/>
  <circle cx="208" cy="124" r="10" fill="#86C69C"/>
  <text x="260" y="131" fill="#DCE8DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">OpenCtrlC</text>
  <text x="1248" y="131" fill="#86C69C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">● local project</text>

  <text x="152" y="232" fill="#A8D8B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ openctrlc</text>
  <text x="152" y="286" fill="#DCE8DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">Find the safest place to add this feature.</text>

  <rect x="152" y="336" width="1296" height="150" rx="12" fill="#111512" fill-opacity="0.72" stroke="#354039"/>
  <text x="186" y="382" fill="#F58A62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">Inspect</text>
  <text x="318" y="382" fill="#DCE8DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">project structure and existing patterns</text>
  <text x="186" y="430" fill="#87928B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">→ 4 files inspected</text>
  <text x="186" y="462" fill="#87928B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">→ context ready for a focused change</text>

  <text x="152" y="565" fill="#DCE8DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">I’ll trace the existing pattern first, then show the smallest safe edit.</text>
  <text x="152" y="631" fill="#87928B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">session  ·  context  ·  tools  ·  output</text>

  <path d="M152 708H1448" stroke="#354039"/>
  <text x="152" y="766" fill="#A8D8B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">openctrlc</text>
  <text x="330" y="766" fill="#87928B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ready · local-first workflow</text>
  <rect x="152" y="810" width="14" height="26" rx="2" fill="#F58A62"/>
</svg>
