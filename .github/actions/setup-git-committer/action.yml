name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  openctrlc-app-id:
    description: "OpenCtrlC GitHub App ID"
    required: false
    default: ""
  openctrlc-app-secret:
    description: "OpenCtrlC GitHub App private key"
    required: false
    default: ""
  fallback-token:
    description: "Token used when the GitHub App credentials are not configured"
    required: false
    default: ""
outputs:
  token:
    description: "GitHub App token or fallback token"
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: inputs.openctrlc-app-id != '' && inputs.openctrlc-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.openctrlc-app-id }}
        private-key: ${{ inputs.openctrlc-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Select token
      id: token
      shell: bash
      env:
        APP_TOKEN: ${{ steps.apptoken.outputs.token }}
        FALLBACK_TOKEN: ${{ inputs.fallback-token || github.token }}
      run: |
        set -euo pipefail
        token="$APP_TOKEN"
        if [ -z "$token" ]; then
          token="$FALLBACK_TOKEN"
        fi
        if [ -z "$token" ]; then
          echo "No GitHub token is available" >&2
          exit 1
        fi
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug || 'github-actions' }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
