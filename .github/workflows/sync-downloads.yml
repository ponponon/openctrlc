name: Sync OpenCtrlC Downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to sync, for example v0.1.3"
        required: true
        type: string
      retention:
        description: "How many release versions to retain in R2"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Sync published release assets to R2
        run: node script/publish-release-downloads.mjs --tag "${{ inputs.tag }}" --repository "${{ github.repository }}" --retention "${{ inputs.retention }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
