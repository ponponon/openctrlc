name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCTRLC_BUMP: ${{ inputs.bump }}
          OPENCTRLC_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          OPENCTRLC_CHANNEL: prod
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI archives
        run: ./packages/opencode/script/build.ts
        env:
          OPENCTRLC_VERSION: ${{ needs.version.outputs.version }}
          OPENCTRLC_RELEASE: ${{ needs.version.outputs.release }}
          OPENCTRLC_CHANNEL: prod
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openctrlc-cli
          path: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz

  publish:
    needs:
      - version
      - build-cli
    if: github.repository == 'ponponon/openctrlc'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openctrlc-cli
          path: packages/opencode/dist

      - name: Upload CLI release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" packages/opencode/dist/*.zip packages/opencode/dist/*.tar.gz --clobber --repo "${{ needs.version.outputs.repo }}"
