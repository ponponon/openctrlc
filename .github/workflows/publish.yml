name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Make source CLI available
        run: |
          cat > "$RUNNER_TEMP/openctrlc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec bun run --cwd packages/opencode --conditions=browser src/index.ts "$@"
          EOF
          chmod +x "$RUNNER_TEMP/openctrlc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCTRLC_BUMP: ${{ inputs.bump }}
          OPENCTRLC_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          OPENCTRLC_CHANNEL: prod
          OPENCTRLC_CHANGELOG_MODE: raw
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  ensure-tag:
    needs: version
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Ensure release tag points to the workflow commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          git fetch origin --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            actual="$(git rev-parse "${TAG}^{commit}")"
            if [ "$actual" = "$TARGET" ]; then
              echo "Verified ${TAG} at ${TARGET}"
              exit 0
            fi

            draft="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "Tag ${TAG} points to ${actual}, expected ${TARGET}" >&2
              exit 1
            fi

            echo "Updating draft ${TAG} from ${actual} to ${TARGET}"
            git tag -a -f "$TAG" "$TARGET" -m "Release $TAG"
            git push --force origin "refs/tags/$TAG"
            exit 0
          fi

          git tag -a "$TAG" "$TARGET" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

  build-cli:
    needs:
      - version
      - ensure-tag
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build CLI archives
        run: ./packages/opencode/script/build.ts
        env:
          OPENCTRLC_VERSION: ${{ needs.version.outputs.version }}
          OPENCTRLC_RELEASE: ${{ needs.version.outputs.release }}
          OPENCTRLC_CHANNEL: prod
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openctrlc-cli
          path: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz

  sign-cli-macos:
    needs:
      - version
      - build-cli
    runs-on: macos-14
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openctrlc-cli
          path: packages/opencode/dist

      - name: Import CLI Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Missing MACOS_DEVELOPER_ID_P12_BASE64 or MACOS_DEVELOPER_ID_P12_PASSWORD" >&2
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/openctrlc-cli.keychain-db"
          certificate_path="$RUNNER_TEMP/openctrlc-cli-developer-id.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Sign and repack macOS CLI archives
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/openctrlc-cli.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi

          for name in openctrlc-darwin-arm64 openctrlc-darwin-x64 openctrlc-darwin-x64-baseline; do
            mkdir -p "packages/opencode/dist/$name/bin"
            unzip -q "packages/opencode/dist/$name.zip" -d "packages/opencode/dist/$name/bin"
            file="packages/opencode/dist/$name/bin/openctrlc"
            chmod +x "$file"
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements packages/opencode/script/entitlements.plist \
              --keychain "$keychain_path" \
              --sign "$identity" \
              "$file"
            codesign --verify --deep --strict --verbose=4 "$file"
            codesign --display --requirements - "$file"
            (cd "packages/opencode/dist/$name/bin" && zip -r "../../$name-signed.zip" .)
            mv "packages/opencode/dist/$name-signed.zip" "packages/opencode/dist/$name.zip"
          done

      - name: Smoke test signed CLI on the runner architecture
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) name=openctrlc-darwin-arm64 ;;
            x86_64) name=openctrlc-darwin-x64 ;;
            *) echo "Unsupported macOS runner architecture" >&2; exit 1 ;;
          esac
          actual="$("packages/opencode/dist/$name/bin/openctrlc" --version)"
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "CLI version mismatch: expected $EXPECTED_VERSION, got $actual" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openctrlc-cli-signed-macos
          path: |
            packages/opencode/dist/openctrlc-darwin-arm64.zip
            packages/opencode/dist/openctrlc-darwin-x64.zip
            packages/opencode/dist/openctrlc-darwin-x64-baseline.zip
          if-no-files-found: error

      - name: Remove temporary CLI signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/openctrlc-cli.keychain-db" || true
          rm -f "$RUNNER_TEMP/openctrlc-cli-developer-id.p12"

  check-desktop-icons:
    needs:
      - version
      - ensure-tag
    runs-on: ubuntu-24.04
    if: github.repository == 'ponponon/openctrlc'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Validate all desktop icon sizes and corner insets
        run: bun run --cwd packages/desktop check:icons

  build-desktop-macos:
    needs:
      - version
      - ensure-tag
      - check-desktop-icons
    if: github.repository == 'ponponon/openctrlc'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTIFICATE_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Missing MACOS_DEVELOPER_ID_P12_BASE64 or MACOS_DEVELOPER_ID_P12_PASSWORD" >&2
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/openctrlc-build.keychain-db"
          certificate_path="$RUNNER_TEMP/openctrlc-developer-id.p12"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"

      - name: Build and notarize macOS Desktop
        env:
          OPENCTRLC_CHANNEL: prod
          OPENCTRLC_VERSION: ${{ needs.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID" >&2
            exit 1
          fi
          export NODE_OPTIONS="--max-old-space-size=6144"
          bun run --cwd packages/desktop build
          bun run --cwd packages/desktop check:icons -- --channel prod --resources
          bun run --cwd packages/desktop package:mac -- --publish never

      - name: Upload macOS Desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_REPO: ${{ needs.version.outputs.repo }}
        run: gh release upload "$RELEASE_TAG" packages/desktop/dist/*.dmg packages/desktop/dist/*.zip --clobber --repo "$GH_REPO"

  build-desktop-windows:
    name: Windows Desktop (${{ matrix.arch }})
    needs:
      - version
      - ensure-tag
      - check-desktop-icons
    if: github.repository == 'ponponon/openctrlc'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun
        with:
          # Windows Bun patch installs can leave an ENOTEMPTY cache entry behind.
          install-flags: --force --no-cache

      - name: Build and package Windows Desktop
        env:
          OPENCTRLC_CHANNEL: prod
          OPENCTRLC_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=6144"
          bun run --cwd packages/desktop build
          bun run --cwd packages/desktop check:icons -- --channel prod --resources
          bun run --cwd packages/desktop package:win -- --publish never --${{ matrix.arch }}

      - name: Upload Windows Desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_REPO: ${{ needs.version.outputs.repo }}
        run: gh release upload "$RELEASE_TAG" "packages/desktop/dist/openctrlc-win-${{ matrix.arch }}.exe" --clobber --repo "$GH_REPO"

  build-desktop-linux:
    name: Linux Desktop (${{ matrix.arch }})
    needs:
      - version
      - ensure-tag
      - check-desktop-icons
    if: github.repository == 'ponponon/openctrlc'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Build and package Linux Desktop
        env:
          OPENCTRLC_CHANNEL: prod
          OPENCTRLC_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--max-old-space-size=6144"
          bun run --cwd packages/desktop build
          bun run --cwd packages/desktop check:icons -- --channel prod --resources
          bun run --cwd packages/desktop package:linux -- --publish never --${{ matrix.arch }}
          # electron-builder emits distro-specific architecture spellings on Linux;
          # normalize the public asset names used by the download routes and notes.
          for extension in deb AppImage rpm; do
            source="$(find packages/desktop/dist -maxdepth 1 -type f -iname "*.${extension}" -print -quit)"
            if [ -z "$source" ]; then
              echo "Missing Linux ${extension} artifact for ${{ matrix.arch }}" >&2
              exit 1
            fi
            target="packages/desktop/dist/openctrlc-linux-${{ matrix.arch }}.${extension}"
            if [ "$source" != "$target" ]; then
              mv "$source" "$target"
            fi
          done

      - name: Upload Linux Desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          GH_REPO: ${{ needs.version.outputs.repo }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "packages/desktop/dist/openctrlc-linux-${{ matrix.arch }}.AppImage" \
            "packages/desktop/dist/openctrlc-linux-${{ matrix.arch }}.deb" \
            "packages/desktop/dist/openctrlc-linux-${{ matrix.arch }}.rpm" \
            --clobber --repo "$GH_REPO"

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-macos
      - build-desktop-macos
      - build-desktop-windows
      - build-desktop-linux
    if: github.repository == 'ponponon/openctrlc'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      repo: ${{ needs.version.outputs.repo }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openctrlc-cli
          path: packages/opencode/dist

      - name: Replace unsigned macOS CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openctrlc-cli-signed-macos
          path: packages/opencode/dist

      - name: Upload CLI release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" packages/opencode/dist/*.zip packages/opencode/dist/*.tar.gz --clobber --repo "${{ needs.version.outputs.repo }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --repo "${{ needs.version.outputs.repo }}"

  sync-downloads:
    needs:
      - version
      - publish
    if: github.repository == 'ponponon/openctrlc'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}

      - name: Sync published release assets to R2
        run: node script/publish-release-downloads.mjs --tag "${{ needs.publish.outputs.tag }}" --repository "${{ needs.publish.outputs.repo }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
