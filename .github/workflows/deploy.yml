name: deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.repository == 'ponponon/openctrlc'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build marketing site
        run: bun run --cwd packages/console/app build

      - name: Build documentation site
        env:
          SST_STAGE: production
        run: bun run --cwd packages/web build

      - name: Ensure Pages projects exist
        shell: bash
        run: |
          set -euo pipefail
          for project in openctrlc openctrlc-docs; do
            if ! bunx wrangler pages project list --json | jq -e --arg project "$project" 'any(.[]; (."Project Name" // .name) == $project)' >/dev/null; then
              bunx wrangler pages project create "$project" --production-branch dev
            fi
          done

      - name: Prepare marketing Pages output
        shell: bash
        run: |
          set -euo pipefail
          marketing_dir="$RUNNER_TEMP/openctrlc-pages"
          mkdir -p "$marketing_dir"
          rsync -a --exclude '_worker.js' packages/console/app/dist/ "$marketing_dir/"
          bunx --package=esbuild@0.25.12 esbuild packages/console/app/dist/_worker.js/index.js \
            --bundle \
            --format=esm \
            --platform=neutral \
            --outfile="$marketing_dir/_worker.js" \
            '--external:cloudflare:workers' \
            '--external:node:*' \
            --log-level=warning
          cp packages/console/app/dist/_worker.js/wrangler.json "$marketing_dir/wrangler.json"

      - name: Deploy marketing site
        run: bunx wrangler pages deploy "$RUNNER_TEMP/openctrlc-pages" --project-name openctrlc --commit-dirty=true --no-bundle

      - name: Prepare documentation Pages output
        shell: bash
        run: |
          set -euo pipefail
          docs_dir="$RUNNER_TEMP/openctrlc-docs"
          mkdir -p "$docs_dir/docs"
          cp -R packages/web/dist/docs/. "$docs_dir/docs/"

      - name: Deploy documentation site
        run: bunx wrangler pages deploy "$RUNNER_TEMP/openctrlc-docs" --project-name openctrlc-docs --commit-dirty=true
