name: "OpenCtrlC GitHub Action"
description: "Run OpenCtrlC in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the OpenCtrlC session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/openctrlc,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.opencode.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get OpenCtrlC version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/ponponon/openctrlc/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache OpenCtrlC
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.openctrlc/bin
        key: openctrlc-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install OpenCtrlC
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://openctrlc.quniv.cn/install | OPENCTRLC_INSTALL_DIR="$HOME/.openctrlc/bin" bash

    - name: Add OpenCtrlC to PATH
      shell: bash
      run: echo "OPENCTRLC_INSTALL_DIR=$HOME/.openctrlc/bin" >> "$GITHUB_ENV" && echo "$HOME/.openctrlc/bin" >> "$GITHUB_PATH"

    - name: Run OpenCtrlC
      shell: bash
      id: run_openctrlc
      run: openctrlc github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
